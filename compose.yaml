services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345678}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build: ./backend
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-12345678}@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  app:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-12345678}@db:5432/app
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3000"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - app-storage:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: "http://app:3000"
        NEXT_PUBLIC_API_URL: /api
    environment:
      BACKEND_URL: "http://app:3000"
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      app:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.practice.rule=Host(`praktika67.duckdns.org`)"
      - "traefik.http.routers.practice.entrypoints=websecure"
      - "traefik.http.routers.practice.tls.certresolver=letsencrypt"
      - "traefik.http.services.practice.loadbalancer.server.port=3000"


  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.practice-pgadmin.rule=Host(`pgadmin.praktika67.duckdns.org`)"
      - "traefik.http.routers.practice-pgadmin.entrypoints=websecure"
      - "traefik.http.routers.practice-pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.services.practice-pgadmin.loadbalancer.server.port=80"

volumes:
  pgdata:
  app-storage:
  pgadmin-data:

networks:
  default:
    name: traefik
    external: true
