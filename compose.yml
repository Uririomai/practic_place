services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ./backend/
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://postgres:12345678@db:5432/app
      JWT_SECRET: blah-blah
      PORT: "3000"
      ADMIN_EMAIL: admin123@example.com
      ADMIN_PASSWORD: 12345678
      SWAGGER_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ./backend/
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://postgres:12345678@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
